name: Claude Code Review

on:
  pull_request:
    types: [opened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 저장소의 루트에 있는 CLAUDE.md 파일을 읽고, 그 안에 정의된 코드 컨벤션
            (패키지 구조, 명명 규칙, 로직 작성 규칙, 테스트 코드 작성 규칙 등)을 기준으로
            이번 PR의 변경 사항(diff)을 리뷰해줘.
            PR 브랜치는 이미 현재 작업 디렉토리에 체크아웃되어 있어.

            리뷰 방식:
            - 지적 사항은 절대 하나의 긴 총평 댓글로 몰아서 작성하지 말고,
              문제가 되는 코드 줄마다 `mcp__github_inline_comment__create_inline_comment`
              (반드시 `confirmed: true`)를 사용해서 하나씩 인라인 코멘트로 남겨줘.
            - 각 인라인 코멘트는 CLAUDE.md의 "리뷰/병합 규칙"에 맞춰 등급을 표시해줘:
              - 🔴 Important: 컨벤션 위반, 버그, 테스트 코드 누락처럼 병합 전 반드시 고쳐야 하는 것
              - 🟡 Nit: 있으면 좋지만 선택적으로 반영해도 되는 것
            - 새로운 API 엔드포인트를 추가하는 PR인데 대응하는 테스트 코드가 없다면
              반드시 🔴 Important로 지적해줘 (CLAUDE.md "API 생성 시 테스트코드 즉시 작성" 규칙).
            - `gh pr comment`로 남기는 총평은 발견한 이슈 개수 요약 정도로 아주 짧게만 쓰고,
              구체적인 설명은 모두 인라인 코멘트에 담아줘. 리뷰 내용을 채팅 메시지로만 말하지 말고
              반드시 GitHub 댓글로 남겨줘.
            - 컨벤션을 잘 지킨 부분까지 굳이 칭찬하는 댓글을 달 필요는 없어.
            - 백그라운드/서브에이전트를 띄우지 말고, 이 세션 안에서 직접 diff를 읽고 바로
              댓글을 게시해줘.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
