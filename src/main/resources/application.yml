spring:
  application:
    name: TripMate
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
  swagger-ui:
    tags-sorter: none
    operations-sorter: none
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
jwt:
  secret:
    key: ${JWT_SECRET_KEY}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}